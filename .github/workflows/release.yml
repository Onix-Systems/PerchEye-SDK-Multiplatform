# .github/workflows/release.yml
name: Create Releases

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 1.0.3-4)'
        required: true

env:
  # Використовуємо commit hash для версії Android або input version
  ANDROID_VERSION: ${{ github.event.inputs.version || github.sha }}

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get short commit hash
        id: vars
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Create Android Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: android-${{ github.event.inputs.version || steps.vars.outputs.short_sha }}
          name: Android SDK ${{ github.event.inputs.version || steps.vars.outputs.short_sha }}
          body: |
            # Android SDK Release
            
            **What's included:**
            - `perch-eye-*.aar` - Android library (ready to use)
            
            **How to use:**
            1. Download the `.aar` file
            2. Copy to your Android project's `libs/` folder
            3. Add to `build.gradle`:
               ```gradle
               dependencies {
                   implementation(files("libs/perch-eye-X.Y.Z.aar"))
               }
               ```
            
            **Build from commit:** ${{ github.sha }}
          files: |
            android-aar/*.aar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ios-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for missing C++ dependencies
        run: |
          echo "🔍 Checking for required C++ files..."
          
          # Перевіряємо чи існують потрібні C++ файли
          if [ ! -d "perch-eye-sdk-core" ]; then
            echo "❌ Missing perch-eye-sdk-core directory"
            echo "The iOS framework requires C++ core files that are not included in this repository."
            echo "BUILD_STATUS=failed" >> $GITHUB_ENV
            exit 0
          fi
          
          echo "BUILD_STATUS=success" >> $GITHUB_ENV

      - name: Package iOS Release
        run: |
          # Завжди пакуємо сирці оскільки С++ core відсутній
          echo "📦 Packaging iOS framework sources..."
          
          mkdir -p ios-release-package
          
          # Копіюємо iOS framework сирці
          cp -r ios/ ios-release-package/PerchEyeFramework-iOS/
          
          # Копіюємо демо проект якщо є
          if [ -d "ios-demo" ]; then
            cp -r ios-demo/ ios-release-package/ios-demo/
          fi
          
          # Створюємо інструкції
          cat > ios-release-package/BUILD_INSTRUCTIONS.md << 'EOF'
          # iOS Framework Build Instructions
          
          ## ⚠️ Missing Dependencies
          
          This iOS framework requires C++ core files that are not included in this repository.
          
          ### Required files:
          - `perch-eye-sdk-core/cpp/perch_eye_core.cpp`
          - `perch-eye-sdk-core/cpp/perch-eye-core/model/tf_model.cpp`
          - And related header files
          
          ### To build the XCFramework:
          
          1. Add the missing C++ core files to your project
          2. Update file paths in Xcode project if needed
          3. Run the build script:
             ```bash
             cd PerchEyeFramework-iOS
             chmod +x build_xcframework.sh
             ./build_xcframework.sh
             ```
          
          ### Alternative options:
          - Contact the repository maintainers for the complete source code
          - Use a pre-built XCFramework if available
          - Remove C++ dependencies and use Swift-only implementation
          
          EOF
          
          # Пакуємо все разом
          zip -r PerchEyeFramework-iOS-Sources.zip ios-release-package/

      - name: Create iOS Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ios-v1.0.0
          name: iOS SDK v1.0.0
          body: |
            # iOS SDK Release v1.0.0
            
            ⚠️ **Source Code Only - Build Required**
            
            **What's included:**
            - `PerchEyeFramework-iOS-Sources.zip` - iOS Framework source code
            - Build instructions and dependency information
            - iOS demo project
            
            **Important Notes:**
            - This package contains **source code only**
            - Requires additional C++ core files (not included)
            - See `BUILD_INSTRUCTIONS.md` for details
            - No pre-built XCFramework available due to missing dependencies
            
            **Build from commit:** ${{ github.sha }}
          files: |
            ios/PerchEyeFramework-iOS-Sources.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs

      - name: Create Docs Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: docs-v1.0.0
          name: Documentation v1.0.0
          body: |
            # Documentation v1.0.0
            
            📖 **Live Documentation:** https://onix-systems.github.io/PerchEye-SDK-Multiplatform
            
            Visit the link above for the latest documentation.
            No files attached - documentation is available online only.
            
            **Updated from commit:** ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}